<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Où est la thune ?</title>
		<link rel="stylesheet" href="./assets/leaflet/leaflet.css" />
		<script src="./assets/leaflet/leaflet.js"></script>
		<link
			rel="icon"
			type="image/x-icon"
			href="./assets/images/marker-icon-2x-red.png"
		/>
		<link rel="stylesheet" href="./styles/style.css" />
		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<div id="map"></div>

		<aside class="sidebar">
			<header>
				<button class="icon background" aria-label="Ouvrir le menu principal">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M4 5h16" />
						<path d="M4 12h16" />
						<path d="M4 19h16" />
					</svg>
				</button>
				<h1>Où est la thune ?</h1>
			</header>
			<section class="search-section">
				<form>
					<div class="input-group-container">
						<div class="timeline-icons" aria-hidden="true">
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="24"
								height="24"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<line x1="2" x2="5" y1="12" y2="12" />
								<line x1="19" x2="22" y1="12" y2="12" />
								<line x1="12" x2="12" y1="2" y2="5" />
								<line x1="12" x2="12" y1="19" y2="22" />
								<circle cx="12" cy="12" r="7" />
							</svg>

							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="24"
								height="24"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<path
									d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
								/>
								<circle cx="12" cy="10" r="3" />
							</svg>
						</div>

						<div class="inputs-wrapper">
							<label for="start-point" class="sr-only">Point de départ</label>
							<input
								type="text"
								id="start-point"
								name="start"
								class="input-field"
								placeholder="Point de départ"
							/>

							<label for="bank-select" class="sr-only"
								>Sélectionner une banque</label
							>
							<input
								type="text"
								id="bank-select"
								name="bank"
								class="input-field"
								placeholder="Sélectionner une banque"
							/>
						</div>
					</div>

					<div class="divider" role="presentation"></div>

					<button type="submit" class="btn-primary">
						Le distributeur le plus proche
					</button>

					<div class="radius-control">
						<div class="radius-label-wrapper">
							<label for="selected_radius">Ajuster le rayon :</label>
							<div class="radius-value-wrapper">
								<svg
									id="radius-loader"
									xmlns="http://www.w3.org/2000/svg"
									width="16"
									height="16"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
									class="radius-loader hidden"
								>
									<path d="M21 12a9 9 0 1 1-6.219-8.56" />
								</svg>
								<span id="radius-value" class="radius-value">2km</span>
							</div>
						</div>
						<input
							type="range"
							id="selected_radius"
							class="radius-slider"
							min="500"
							max="5000"
							step="100"
							value="2000"
						/>
						<div class="radius-markers">
							<span>500m</span>
							<span>5km</span>
						</div>
					</div>

					<div class="divider" role="presentation"></div>
				</form>
			</section>

			<section class="results-section" aria-labelledby="results-heading">
				<div class="section-header">
					<h2 id="results-heading">Les plus proches de vous :</h2>
				</div>

				<ul class="card-list">
					<li>
						<article class="card">
							<div class="card-left">
								<div class="bank-info">
									<h3 class="bank-name"></h3>
									<span class="bank-city"></span>
								</div>
								<div class="distance-badge"></div>
							</div>
						</article>
					</li>

					<li>
						<article class="card">
							<div class="card-left">
								<div class="bank-info">
									<h3 class="bank-name"></h3>
									<span class="bank-city"></span>
								</div>
								<div class="distance-badge"></div>
							</div>
						</article>
					</li>

					<li>
						<article class="card">
							<div class="card-left">
								<div class="bank-info">
									<h3 class="bank-name"></h3>
									<span class="bank-city"></span>
								</div>
								<div class="distance-badge"></div>
							</div>
						</article>
					</li>
				</ul>
			</section>
		</aside>

		<aside class="controls">
			<div class="controls-top">
				<div class="background text switch-wrapper">
					<button type="button" role="switch" aria-checked="false" id="mode">
						<span class="switch-thumb"> </span>
					</button>
					<label for="mode">Mode libre</label>
				</div>
				<button
					class="background icon"
					aria-label="Ouvrir le menu"
					title="Ouvrir le menu"
				>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<circle cx="12" cy="12" r="1" />
						<circle cx="12" cy="5" r="1" />
						<circle cx="12" cy="19" r="1" />
					</svg>
				</button>
			</div>

			<div class="controls-bottom">
				<button
					id="locate"
					class="primary icon"
					aria-label="Me localiser"
					title="Me localiser"
				>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="24"
						height="24"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<line x1="2" x2="5" y1="12" y2="12" />
						<line x1="19" x2="22" y1="12" y2="12" />
						<line x1="12" x2="12" y1="2" y2="5" />
						<line x1="12" x2="12" y1="19" y2="22" />
						<circle cx="12" cy="12" r="7" />
					</svg>
				</button>

				<div class="controls-zoom" role="group" aria-label="Contrôles de zoom">
					<button
						id="zoom-in"
						class="background icon"
						aria-label="Zoomer"
						title="Zoomer"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M5 12h14" />
							<path d="M12 5v14" />
						</svg>
					</button>
					<button
						id="zoom-out"
						class="background icon"
						aria-label="Dézoomer"
						title="Dézoomer"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="24"
							height="24"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
						>
							<path d="M5 12h14" />
						</svg>
					</button>
				</div>
			</div>
		</aside>

		<script src="./js/location.js"></script>
		<script src="./js/cluster.js"></script>
		<script src="./js/itinerary.js"></script>
		<script src="./js/script.js"></script>
	</body>
</html>
